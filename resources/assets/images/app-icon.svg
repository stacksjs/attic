    <rect x="300" y="530" width="424" height="110" rx="46" fill="#FFFFFF" fill-opacity="0.78"/>
    <rect x="278" y="618" width="468" height="150" rx="58" fill="url(#card)"/>
  </g>
  <rect x="352" y="672" width="210" height="22" rx="11" fill="#E8603C" fill-opacity="0.9"/>
  <rect x="352" y="714" width="138" height="22" rx="11" fill="#E8603C" fill-opacity="0.45"/>
</svg>
